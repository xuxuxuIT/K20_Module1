<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Form</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
      }

      #register-form {
        width: 400px;
        margin: 50px auto;
        padding: 20px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
      }

      #register-form div {
        margin-bottom: 15px;
      }

      input {
        width: 100%;
        padding: 10px;
        font-size: 16px;
      }

      .error-msg {
        display: block;
        color: red;
        font-size: 14px;
        margin-top: 5px;
        min-height: 18px;
      }

      button {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      #success-message {
        width: 400px;
        margin: 20px auto;
        text-align: center;
        color: green;
        font-size: 18px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <form id="register-form">
      <div>
        <input type="text" id="username" placeholder="Tên đăng nhập" />
        <span class="error-msg" id="username-error"></span>
      </div>

      <div>
        <input type="email" id="email" placeholder="Email" />
        <span class="error-msg" id="email-error"></span>
      </div>

      <div>
        <input type="password" id="password" placeholder="Mật khẩu" />
        <span class="error-msg" id="password-error"></span>
      </div>

      <div>
        <input
          type="password"
          id="confirm-password"
          placeholder="Nhập lại mật khẩu"
        />
        <span class="error-msg" id="confirm-password-error"></span>
      </div>

      <button type="submit" id="submit-btn" disabled>Đăng ký</button>
    </form>

    <script src="./bt2.js"></script>
  </body>
</html>
